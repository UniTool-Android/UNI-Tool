name: Build Termux bootstrap (ahk.unitool.gsm)

# Rebuilds the native Termux bootstrap for applicationId ahk.unitool.gsm.
# Manual dispatch only for expensive builds (typically 2–4+ hours).

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: "Bootstrap architectures (comma-separated)"
        required: true
        default: "aarch64"
      extra_packages:
        description: "Extra packages to preinstall (comma-separated)"
        required: false
        default: ""

concurrency:
  group: termux-bootstrap
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bootstrap:
    name: Generate bootstrap for ahk.unitool.gsm
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TERMUX_ARCHITECTURES: ${{ inputs.architectures || 'aarch64' }}
      TERMUX_EXTRA_PACKAGES: ${{ inputs.extra_packages || '' }}

    steps:
      - name: Checkout termux-generator
        uses: actions/checkout@v4
        with:
          repository: ahksoft/termux-generator
          path: termux-generator

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk git patch curl unzip

      - name: Validate build inputs
        shell: bash
        run: |
          set -euo pipefail
          ARCH="${TERMUX_ARCHITECTURES:-aarch64}"
          EXTRA="${TERMUX_EXTRA_PACKAGES:-}"
          if [[ -z "$ARCH" ]]; then
            ARCH="aarch64"
          fi
          if [[ ! "$ARCH" =~ ^[a-zA-Z0-9_,.-]+$ ]]; then
            echo "::error::Invalid architecture list: $ARCH"
            exit 1
          fi
          if [[ -n "$EXTRA" && ! "$EXTRA" =~ ^[a-zA-Z0-9+_.:,,-]+$ ]]; then
            echo "::error::Invalid extra package list: $EXTRA"
            exit 1
          fi
          echo "Using architectures: $ARCH"
          echo "Extra packages: ${EXTRA:-<none>}"

      - name: Build Termux (custom package name)
        working-directory: termux-generator
        shell: bash
        run: |
          set -euo pipefail
          ARCH="${TERMUX_ARCHITECTURES:-aarch64}"
          EXTRA="${TERMUX_EXTRA_PACKAGES:-}"
          [[ -n "$ARCH" ]] || ARCH="aarch64"

          ARGS=(--name ahk.unitool.gsm --architectures "$ARCH")
          if [[ -n "$EXTRA" ]]; then
            ARGS+=(--add "$EXTRA")
          fi

          # Disable optional companion apps not shipped by Uni Tool.
          ARGS+=(
            --disable-tasker
            --disable-float
            --disable-widget
            --disable-api
            --disable-boot
            --disable-styling
            --disable-x11
          )

          chmod +x ./build-termux.sh
          printf 'Running: ./build-termux.sh'
          printf ' %q' "${ARGS[@]}"
          printf '\n'
          ./build-termux.sh "${ARGS[@]}"

      - name: Collect bootstrap zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -d '' -t BOOTS < <(find termux-generator -type f -name 'bootstrap-*.zip' -print0)
          if (( ${#BOOTS[@]} == 0 )); then
            echo "::error::No bootstrap ZIP was produced"
            find termux-generator -type f -name '*.zip' -print | head -40 || true
            exit 1
          fi
          for BOOT in "${BOOTS[@]}"; do
            cp "$BOOT" "dist/$(basename "$BOOT")"
            unzip -t "dist/$(basename "$BOOT")"
          done
          if [[ ! -f dist/bootstrap-aarch64.zip ]]; then
            echo "::warning::No aarch64 bootstrap was generated; the Android app currently expects bootstrap-aarch64.zip"
          fi
          printf '%s\n' "custom ahk.unitool.gsm" > dist/bootstrap.meta
          ls -lh dist/

      - name: Upload bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux-bootstrap-ahk.unitool.gsm
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Upload to GitHub Release (termux-bootstrap tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: termux-bootstrap
          name: Termux bootstrap for ahk.unitool.gsm
          body: |
            Bootstrap rebuilt for **ahk.unitool.gsm** (termux-generator).
            Place as `app/src/main/assets/termux/bootstrap-aarch64.zip` with `bootstrap.meta` containing `custom`.
          files: |
            dist/bootstrap-*.zip
            dist/bootstrap.meta
          token: ${{ secrets.GITHUB_TOKEN }}

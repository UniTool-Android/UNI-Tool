name: Build Adbify Terminal Library

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build-adbify-terminal.sh"
      - ".github/workflows/build-adbify-terminal.yml"

permissions:
  contents: read

jobs:
  build-terminal-library:
    name: Build Adbify terminalview AAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UniTool
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          link-to-sdk: true

      - name: Build Adbify terminalview
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x scripts/build-adbify-terminal.sh
          ./scripts/build-adbify-terminal.sh

      - name: Upload terminal AAR
        uses: actions/upload-artifact@v4
        with:
          name: adbify-terminalview-aar
          path: app/libs/adbify-terminalview-release.aar
          if-no-files-found: error
          retention-days: 30
